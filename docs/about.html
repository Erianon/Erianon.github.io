<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column; 

        nav {
            background-color: #2c3e50;
            padding: 15px 30px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .profile-container {
            position: absolute;
            top: 100px;  
            left: 40px;  

            display: flex;
            flex-direction: column;
            align-items: flex-start; 
        }
        .avatar {
            width: 130px;        
            height: 130px;
            border-radius: 50%;  
            object-fit: cover;   
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            margin-bottom: 15px; 
        }

        .info-text {
            width: 130px; 
            text-align: right; 
        }

        .bio {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 10px; 
            font-style: italic;
        }

        .github-link {
            display: inline-block;
            font-size: 14px;
            color: #3498db;      
            text-decoration: none; 
            font-weight: bold;
            transition: all 0.3s ease; 
        }
        .github-link:hover {
            color: #2980b9;       
            transform: translateX(5px); 
            text-decoration: underline;
        }

        main {
            margin-left: 250px; 
            padding: 100px 50px 50px 50px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="#">我的项目</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="#">联系方式</a></li>
        </ul>
    </nav>
    <div class="profile-container">
        <img src="头像.jpg" alt="我的头像" class="avatar">
        
        <div class="info-text">
            <p class="bio">白日梦想家<br>日常透明人</p>
            
            <a href="https://github.com/你的GitHub用户名" target="_blank" class="github-link">
                点击这里，访问我的GitHub账号 &rarr;
            </a>
        </div>
    </div>

    <main>
        <h1>关于我</h1>
        <p>个人简介</p>
        <p>拖延症患者，项目目前为棍木，开发什么的我还不会啊<br>
        放生了前额叶，我觉得它是有生命的，不应该在我的脑子里，这片叶子应该有属于他更广阔的大树。<br>
        再说脑袋里长叶子不是给我添乱吗</p>
    </main>

</body>
</html>
