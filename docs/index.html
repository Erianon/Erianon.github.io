<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eriamon 的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column; 
        }

    
        nav {
            background-color: rgba(42, 78, 115, 0.9); 
            padding: 20px 0;
        }
        nav ul {
            display: flex;
            justify-content: space-evenly; 
            list-style: none;
            max-width: 800px; 
            margin: 0 auto; 
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        nav a:hover {
            color: #f0a500; 
        }

        
        main {
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 40px 20px;
            text-align: center;
        }

        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%; 
            border: 3px solid white; 
            object-fit: cover; 
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }

        
        .intro-text {
            color: white;
            font-size: 14px;
            line-height: 1.8;
            max-width: 700px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5); 
        }

        .glass-box {
            background-color: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(5px); 
            padding: 30px;
            border-radius: 8px; 
            max-width: 700px;
            color: white;
            font-size: 13px;
            line-height: 1.8;
            text-align: left;
        }

        footer {
            background-color: rgba(42, 78, 115, 0.9); 
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">首页</a></li>
            <li><a href="#">我的项目</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="#">联系方式</a></li>
        </ul>
    </nav>

    <main>
        
        <img src="头像.jpg" alt="我的头像" class="avatar">
        
        <p class="intro-text">
            every song has a sequel,every dream has a part two
        </p>

        <div class="glass-box">
            maybe not today,maybe not tomorrow,but oneday don't look back in anger
        </div>
    </main>


</body>
</html>
