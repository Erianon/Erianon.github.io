<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <style>
        /* 基础重置，确保没有默认边距干扰 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column; 

        /* --- 导航栏样式（简易版） --- */
        nav {
            background-color: #2c3e50;
            padding: 15px 30px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        nav a:hover {
            text-decoration: underline;
        }

        /* --- 核心：左上角个人信息模块 --- */
        .profile-container {
            /* 绝对定位，固定在页面左上方 */
            position: absolute;
            top: 100px;  /* 避开顶部导航栏，可自行调整 */
            left: 40px;  /* 距离左侧距离，可自行调整 */
            
            /* 使用 Flex 布局方便垂直排列 */
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 整体靠左 */
        }

        /* 头像样式：变大并保持圆形 */
        .avatar {
            width: 130px;        /* 增大头像尺寸 */
            height: 130px;
            border-radius: 50%;  /* 变成圆形 */
            object-fit: cover;   /* 保证图片不变形 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); /* 加点阴影更有质感 */
            margin-bottom: 15px; /* 与下方文字拉开距离 */
        }

        /* 包裹文字和链接的容器 */
        .info-text {
            width: 130px; /* 宽度与头像保持一致，这样“居右”看起来更整齐 */
            text-align: right; /* 让内部文字居右对齐 */
        }

        /* 居右的文案 */
        .bio {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 10px; /* 与下方 GitHub 链接拉开距离 */
            font-style: italic;
        }

        /* 可交互的 GitHub 链接 */
        .github-link {
            display: inline-block;
            font-size: 14px;
            color: #3498db;      /* 链接颜色 */
            text-decoration: none; /* 默认无下划线 */
            font-weight: bold;
            transition: all 0.3s ease; /* 悬停动画过渡 */
        }

        /* 鼠标悬停时的交互效果 */
        .github-link:hover {
            color: #2980b9;       /* 颜色加深 */
            transform: translateX(5px); /* 鼠标放上去时向右微移，增加互动感 */
            text-decoration: underline;
        }

        /* 右侧主体内容区域（防止和左侧头像重叠） */
        main {
            margin-left: 250px; /* 留出左侧头像的空间 */
            padding: 100px 50px 50px 50px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 导航栏 (点击可返回主页) -->
    <nav>
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="#">我的项目</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="#">联系方式</a></li>
        </ul>
    </nav>

    <!-- ======= 核心模块：左上角头像区域 ======= -->
    <div class="profile-container">
        <!-- 1. 头像 (记得替换 src 里的图片路径) -->
        <img src="头像.jpg" alt="我的头像" class="avatar">
        
        <!-- 2. 文字信息容器 -->
        <div class="info-text">
            <!-- 居右的文案 -->
            <p class="bio">热爱代码，热爱生活。<br>一直在路上的开发者。</p>
            
            <!-- 3. 可交互的 GitHub 链接 (替换 href 里的链接) -->
            <!-- target="_blank" 表示在新标签页打开 -->
            <a href="https://github.com/你的GitHub用户名" target="_blank" class="github-link">
                Visit My GitHub &rarr;
            </a>
        </div>
    </div>

    <!-- ======= 右侧正文区域 ======= -->
    <main>
        <h1>关于我</h1>
        <p>这里是页面的正文部分，你可以在这里写你的经历、项目介绍或者任何你想展示的内容。</p>
        <p>因为左边的头像使用了绝对定位（absolute），所以这里的文字不会受到它的影响，排版会很整齐。</p>
    </main>

</body>
</html>
